name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-upload:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported runner = lowest glibc baseline for the prebuilt binary.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pdfium-tgz: pdfium-linux-x64.tgz
            pdfium-lib: libpdfium.so
            app-ext: ""
            asset: doc-signer-linux-x64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pdfium-tgz: pdfium-win-x64.tgz
            pdfium-lib: pdfium.dll
            app-ext: ".exe"
            asset: doc-signer-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: cargo-release-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev libx11-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Fetch pdfium (page preview library)
        run: |
          curl -sL -o pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8179/${{ matrix.pdfium-tgz }}"
          tar xzf pdfium.tgz

      - name: Package
        shell: bash
        run: |
          APP="target/${{ matrix.target }}/release/doc-signer${{ matrix.app-ext }}"
          LIB="$(find . -name '${{ matrix.pdfium-lib }}' -not -path './target/*' -print -quit)"
          if [ ! -f "$LIB" ]; then
            echo "pdfium library not found: ${{ matrix.pdfium-lib }}"
            exit 1
          fi
          mkdir -p dist
          cp "$APP" dist/
          cp "$LIB" dist/
          if [ "${{ runner.os }}" = "Linux" ]; then
            tar czf "dist/${{ matrix.asset }}" -C dist doc-signer libpdfium.so
          else
            # bsdtar on Windows writes zip when -a infers the format from the extension
            (cd dist && tar -a -cf "${{ matrix.asset }}" doc-signer.exe pdfium.dll)
          fi
          ls -la dist/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
          fail_on_unmatched_files: true
