name: CI

on:
  pull_request:
  push:
    branches: [dev, master]

jobs:
  test-linux:
    name: test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: cargo-linux-${{ hashFiles('Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev libx11-dev

      - name: Prepare test data
        run: |
          mkdir -p ci-test/certs
          # Minimal 1-page test PDF (fixture, generated once).
          echo '' | base64 -d > ci-test/test.pdf
          # Self-signed cert with the Microsoft document-signing EKU, unencrypted key.
          openssl req -new -x509 -newkey rsa:2048 -nodes \
            -keyout ci-test/certs/ci.key -out ci-test/certs/ci.crt -days 30 \
            -subj "/CN=Doc Signer CI/O=Acme" \
            -addext "extendedKeyUsage=1.3.6.1.4.1.311.10.3.12,1.3.6.1.5.5.7.3.3"
          THUMB=$(openssl x509 -in ci-test/certs/ci.crt -outform der | openssl sha1 | awk '{print $NF}' | tr '[:lower:]' '[:upper:]')
          echo "DOC_SIGNER_CERTS_DIR=$GITHUB_WORKSPACE/ci-test/certs" >> "$GITHUB_ENV"
          echo "DOC_SIGNER_TEST_PDF=$GITHUB_WORKSPACE/ci-test/test.pdf" >> "$GITHUB_ENV"
          echo "DOC_SIGNER_THUMB=$THUMB" >> "$GITHUB_ENV"

      - name: Run tests (including e2e with real signing)
        run: cargo test -- --include-ignored --nocapture

  test-windows:
    name: test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\cargo\registry
            ~\AppData\Local\cargo\git
            target
          key: cargo-windows-${{ hashFiles('Cargo.lock') }}

      # The e2e signing test skips on Windows when the DOC_SIGNER_* env vars
      # are not set (CNG signing needs a store certificate, not a PEM file).
      - name: Run tests
        run: cargo test --release
