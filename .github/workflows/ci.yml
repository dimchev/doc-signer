name: CI

on:
  pull_request:
  push:
    branches: [dev, master]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: cargo-linux-${{ hashFiles('Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev libx11-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signature validator (pyhanko)
        run: pip install pyhanko pyhanko-certvalidator

      - name: Prepare test data
        run: |
          set -euo pipefail
          mkdir -p ci-test/certs
          cp tests/fixtures/minimal.pdf ci-test/test.pdf
          # Self-signed certificate with the MS document-signing EKU
          openssl req -new -x509 -newkey rsa:2048 -nodes \
            -keyout ci-test/certs/ci.key -out ci-test/certs/ci.crt \
            -days 30 -subj "/CN=Doc Signer CI/O=Acme" \
            -addext "extendedKeyUsage=1.3.6.1.4.1.311.10.3.12,1.3.6.1.5.5.7.3.3"
          THUMB=$(openssl x509 -in ci-test/certs/ci.crt -outform der | openssl sha1 | awk '{print $NF}' | tr '[:lower:]' '[:upper:]')
          {
            echo "DOC_SIGNER_CERTS_DIR=$GITHUB_WORKSPACE/ci-test/certs"
            echo "DOC_SIGNER_TEST_PDF=$GITHUB_WORKSPACE/ci-test/test.pdf"
            echo "DOC_SIGNER_THUMB=$THUMB"
          } >> "$GITHUB_ENV"
          echo "Test cert thumbprint: $THUMB"

      - name: Run tests
        run: cargo test -- --include-ignored --nocapture

      - name: Validate the signed PDF independently
        run: python scripts/validate_signature.py ci-test/test.pdf.signed.pdf ci-test/certs/ci.crt

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: cargo-windows-${{ hashFiles('Cargo.lock') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signature validator (pyhanko)
        run: pip install pyhanko pyhanko-certvalidator

      # Throwaway certificate with a CNG (KSP) key in CurrentUser\My, so the
      # store + NCrypt signing path is exercised end to end.
      - name: Prepare test certificate and data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-test | Out-Null
          Copy-Item tests/fixtures/minimal.pdf ci-test/test.pdf
          $cert = New-SelfSignedCertificate -Subject "CN=Doc Signer CI, O=Acme" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 `
            -Provider "Microsoft Software Key Storage Provider" `
            -KeyUsage DigitalSignature, NonRepudiation `
            -TextExtension @("2.5.29.37={text}1.3.6.1.4.1.311.10.3.12") `
            -NotAfter (Get-Date).AddDays(30)
          Export-Certificate -Cert $cert -FilePath ci-test/ci.cer | Out-Null
          "DOC_SIGNER_TEST_PDF=$PWD\ci-test\test.pdf" >> $env:GITHUB_ENV
          "DOC_SIGNER_THUMB=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          "Test cert thumbprint: $($cert.Thumbprint)"

      - name: Run tests
        run: cargo test --release -- --include-ignored --nocapture

      - name: Validate the signed PDF independently
        run: python scripts/validate_signature.py ci-test/test.pdf.signed.pdf ci-test/ci.cer

      # Legacy CryptoAPI (CSP) key: the CryptSignHash path (#33).
      - name: E2E with a legacy CSP key
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Subject "CN=Doc Signer CI CSP, O=Acme" `
            -CertStoreLocation Cert:\CurrentUser\My -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 `
            -Provider "Microsoft Enhanced RSA and AES Cryptographic Provider" -KeySpec Signature `
            -NotAfter (Get-Date).AddDays(30)
          Export-Certificate -Cert $cert -FilePath ci-test/csp.cer | Out-Null
          Copy-Item tests/fixtures/minimal.pdf ci-test/csp.pdf
          $env:DOC_SIGNER_TEST_PDF = "$PWD\ci-test\csp.pdf"
          $env:DOC_SIGNER_THUMB = $cert.Thumbprint
          cargo test --release signs_with -- --include-ignored --nocapture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/validate_signature.py ci-test/csp.pdf.signed.pdf ci-test/csp.cer