name: CI

on:
  pull_request:
  push:
    branches: [dev, master]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: cargo-linux-${{ hashFiles('Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev libx11-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signature validator (pyhanko)
        run: pip install pyhanko pyhanko-certvalidator

      - name: Prepare test data
        run: |
          set -euo pipefail
          mkdir -p ci-test/certs
          cp tests/fixtures/minimal.pdf ci-test/test.pdf
          # Self-signed certificate with the MS document-signing EKU
          openssl req -new -x509 -newkey rsa:2048 -nodes \
            -keyout ci-test/certs/ci.key -out ci-test/certs/ci.crt \
            -days 30 -subj "/CN=Doc Signer CI/O=Acme" \
            -addext "extendedKeyUsage=1.3.6.1.4.1.311.10.3.12,1.3.6.1.5.5.7.3.3"
          THUMB=$(openssl x509 -in ci-test/certs/ci.crt -outform der | openssl sha1 | awk '{print $NF}' | tr '[:lower:]' '[:upper:]')
          {
            echo "DOC_SIGNER_CERTS_DIR=$GITHUB_WORKSPACE/ci-test/certs"
            echo "DOC_SIGNER_TEST_PDF=$GITHUB_WORKSPACE/ci-test/test.pdf"
            echo "DOC_SIGNER_THUMB=$THUMB"
          } >> "$GITHUB_ENV"
          echo "Test cert thumbprint: $THUMB"

      - name: Run tests
        run: cargo test -- --include-ignored --nocapture

      - name: Validate the signed PDF independently
        run: python scripts/validate_signature.py ci-test/test.pdf.signed.pdf ci-test/certs/ci.crt

      # Encrypted PDFs (#37): RC4-40/128, AES-128/256, user and owner passwords, restricted permissions.
      - name: E2E encrypted PDFs validated with pyhanko
        run: |
          set -euo pipefail
          sign() {
            cp "tests/fixtures/encrypted/$1" "ci-test/$1"
            DOC_SIGNER_TEST_PDF="$GITHUB_WORKSPACE/ci-test/$1" DOC_SIGNER_PDF_PASSWORD="$2" cargo test signs_with -- --include-ignored --nocapture
            python scripts/validate_signature.py "ci-test/$1.signed.pdf" ci-test/certs/ci.crt --password "$2"
          }
          sign rc4-40-owner.pdf ""
          sign rc4-128-user.pdf user
          sign aes-128-owner.pdf ""
          sign aes-256-user.pdf user
          sign aes-256-no-signing.pdf owner

      # Any file as CAdES .p7s / .p7m, verified by OpenSSL (#35).
      - name: E2E .p7s / .p7m verified with OpenSSL
        run: |
          set -euo pipefail
          printf 'Doc Signer CI - arbitrary file\n' > ci-test/file.txt
          DOC_SIGNER_TEST_PDF="$GITHUB_WORKSPACE/ci-test/file.txt" cargo test signs_file -- --include-ignored --nocapture
          openssl cms -verify -binary -inform DER -in ci-test/file.txt.p7s -content ci-test/file.txt -CAfile ci-test/certs/ci.crt -purpose any -out /dev/null
          openssl cms -verify -binary -inform DER -in ci-test/file.txt.p7m -CAfile ci-test/certs/ci.crt -purpose any -out ci-test/recovered.txt
          cmp ci-test/file.txt ci-test/recovered.txt
          echo tampered >> ci-test/file.txt
          if openssl cms -verify -binary -inform DER -in ci-test/file.txt.p7s -content ci-test/file.txt -CAfile ci-test/certs/ci.crt -purpose any -out /dev/null; then
            echo "tampered file verified - this must fail"; exit 1
          fi

      # ASiC-E container (#36): ZIP layout, manifest digests and the CAdES signature over the manifest.
      - name: E2E .asice verified with Python zipfile and OpenSSL
        run: |
          set -euo pipefail
          mkdir -p ci-test/asic
          printf 'Doc Signer CI - ASiC-E\n' > "ci-test/asic/договор 1.txt"
          DOC_SIGNER_TEST_PDF="$GITHUB_WORKSPACE/ci-test/asic/договор 1.txt" cargo test asice_with -- --include-ignored --nocapture
          python - "ci-test/asic/договор 1.txt.asice" ci-test/asic/x <<'PY'
          import base64, hashlib, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          assert z.testzip() is None
          first = z.infolist()[0]
          assert first.filename == "mimetype" and first.compress_type == zipfile.ZIP_STORED
          assert z.read("mimetype") == b"application/vnd.etsi.asic-e+zip"
          manifest = z.read("META-INF/ASiCManifest.xml").decode()
          for n in z.namelist():
              if n != "mimetype" and not n.startswith("META-INF/"):
                  digest = base64.b64encode(hashlib.sha256(z.read(n)).digest()).decode()
                  assert f"<ds:DigestValue>{digest}</ds:DigestValue>" in manifest, n
          z.extractall(sys.argv[2])
          print("ASiC-E layout OK:", z.namelist())
          PY
          openssl cms -verify -binary -inform DER -in ci-test/asic/x/META-INF/signature001.p7s -content ci-test/asic/x/META-INF/ASiCManifest.xml -CAfile ci-test/certs/ci.crt -purpose any -out /dev/null

      # PAdES B-T with a real public TSA (#34).
      - name: E2E with an RFC 3161 time-stamp
        env:
          DOC_SIGNER_TSA: http://timestamp.digicert.com
        run: |
          set -euo pipefail
          cp tests/fixtures/minimal.pdf ci-test/tsa.pdf
          DOC_SIGNER_TEST_PDF="$GITHUB_WORKSPACE/ci-test/tsa.pdf" cargo test signs_with -- --include-ignored --nocapture
          python scripts/validate_signature.py ci-test/tsa.pdf.signed.pdf ci-test/certs/ci.crt --expect-timestamp

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: cargo-windows-${{ hashFiles('Cargo.lock') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signature validator (pyhanko)
        run: pip install pyhanko pyhanko-certvalidator

      # Throwaway certificate with a CNG (KSP) key in CurrentUser\My, so the
      # store + NCrypt signing path is exercised end to end.
      - name: Prepare test certificate and data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-test | Out-Null
          Copy-Item tests/fixtures/minimal.pdf ci-test/test.pdf
          $cert = New-SelfSignedCertificate -Subject "CN=Doc Signer CI, O=Acme" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 `
            -Provider "Microsoft Software Key Storage Provider" `
            -KeyUsage DigitalSignature, NonRepudiation `
            -TextExtension @("2.5.29.37={text}1.3.6.1.4.1.311.10.3.12") `
            -NotAfter (Get-Date).AddDays(30)
          Export-Certificate -Cert $cert -FilePath ci-test/ci.cer | Out-Null
          "DOC_SIGNER_TEST_PDF=$PWD\ci-test\test.pdf" >> $env:GITHUB_ENV
          "DOC_SIGNER_THUMB=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          "Test cert thumbprint: $($cert.Thumbprint)"

      - name: Run tests
        run: cargo test --release -- --include-ignored --nocapture

      - name: Validate the signed PDF independently
        run: python scripts/validate_signature.py ci-test/test.pdf.signed.pdf ci-test/ci.cer

      # Legacy CryptoAPI (CSP) key: the CryptSignHash path (#33).
      - name: E2E with a legacy CSP key
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Subject "CN=Doc Signer CI CSP, O=Acme" `
            -CertStoreLocation Cert:\CurrentUser\My -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 `
            -Provider "Microsoft Enhanced RSA and AES Cryptographic Provider" -KeySpec Signature `
            -NotAfter (Get-Date).AddDays(30)
          Export-Certificate -Cert $cert -FilePath ci-test/csp.cer | Out-Null
          Copy-Item tests/fixtures/minimal.pdf ci-test/csp.pdf
          $env:DOC_SIGNER_TEST_PDF = "$PWD\ci-test\csp.pdf"
          $env:DOC_SIGNER_THUMB = $cert.Thumbprint
          cargo test --release signs_with -- --include-ignored --nocapture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/validate_signature.py ci-test/csp.pdf.signed.pdf ci-test/csp.cer